; Programs of both modes (spec 6.2). Each one runs as its own Unix user through sol-run, which
; injects only that role's configuration and secrets. Lower priority starts first, stops last.
; A program that cannot start (database or RPC down) is retried with a delay one second longer
; after each failure (1, 2, 3 s …): startretries is unbounded in practice, so none ends FATAL.
; supervisord stops the programs one after the other. stopwaitsecs is 40 s where the process has
; its own 30 s shutdown grace (listener and executors) and 10 s elsewhere; their sum plus a margin
; stays below the back's stop_grace_period in deploy/compose.yaml (tests/deploy-back-container).

[program:listener]
command=/usr/local/bin/sol-run listener node /app/dist/src/app.js
user=listener
directory=/app
priority=100
autostart=true
autorestart=true
startsecs=10
startretries=1000000
stopsignal=TERM
stopwaitsecs=40
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:opapi]
command=/usr/local/bin/sol-run opapi node /app/dist/src/operator-api/main.js
user=opapi
directory=/app
priority=110
autostart=true
autorestart=true
startsecs=5
startretries=1000000
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:retention]
command=/usr/local/bin/sol-run retention node /app/dist/scripts/purge-retained-data.js
user=retention
directory=/app
priority=120
autostart=true
autorestart=true
startsecs=5
startretries=1000000
stopsignal=TERM
stopwaitsecs=10
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
