; Programs of both modes (spec 6.2). Each one runs as its own Unix user through sol-run, which
; injects only that role's configuration and secrets. Lower priority starts first, stops last.

[program:listener]
command=/usr/local/bin/sol-run listener node /app/dist/src/app.js
user=listener
directory=/app
priority=100
autostart=true
autorestart=true
startsecs=10
startretries=10
stopsignal=TERM
stopwaitsecs=40
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:opapi]
command=/usr/local/bin/sol-run opapi node /app/dist/src/operator-api/main.js
user=opapi
directory=/app
priority=110
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=40
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:retention]
command=/usr/local/bin/sol-run retention node /app/dist/scripts/purge-retained-data.js
user=retention
directory=/app
priority=120
autostart=true
autorestart=true
startsecs=5
startretries=10
stopsignal=TERM
stopwaitsecs=40
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
